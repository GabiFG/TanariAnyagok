<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hatványok – színes levezetés</title>
<style>
:root{--c0:#ef476f;--c1:#118ab2;--c2:#06a77d;--c3:#f4a300;--c4:#8e44ad;--ink:#26304a}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f4ff,#ffeaf2 55%,#fff7d6);min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:clamp(24px,5vw,36px);margin:6px 0 12px}
.rules{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.rule{color:#fff;font-weight:700;padding:8px 14px;border-radius:14px;font-size:15px}
.r0{background:#8e44ad}.r1{background:#f4731a}.r2{background:#118ab2}.r3{background:#06a77d}
.input{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 #26304a22}
.input input{width:100%;font-size:clamp(18px,4vw,24px);padding:10px 12px;border:3px solid #26304a33;border-radius:12px;font-family:inherit;color:var(--ink)}
.input input:focus{outline:none;border-color:var(--c1)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;color:#fff;background:var(--c1);transition:transform .15s}
button:hover:not(:disabled){transform:translateY(-2px) scale(1.04)}
button:disabled{opacity:.4;cursor:default}
button.pow{background:#06a77d;font-size:18px}button.go{background:var(--c2)}button.next{background:var(--c0)}button.alt{background:#6c7a99}
.ex{background:#fff;color:var(--ink);border:2px dashed #26304a44;font-weight:600;font-size:14px}
.err{color:#c92a2a;font-weight:700;margin-top:8px;min-height:1em}
.stage{background:#fff;border-radius:20px;padding:14px 16px;margin:16px 0;border-left:10px solid;animation:slide .5s both;box-shadow:0 4px 0 #26304a22}
.stage.ph0{border-color:#8e44ad}.stage.ph1{border-color:#f4731a}.stage.ph2{border-color:#118ab2}
.shead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.badge{color:#fff;font-weight:800;padding:5px 12px;border-radius:999px}
.stage.ph3{border-color:#06a77d}.ph3 .badge{background:#06a77d}.ph0 .badge{background:#8e44ad}.ph1 .badge{background:#f4731a}.ph2 .badge{background:#118ab2}
.hint{font-size:14px;opacity:.8}
.modes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 12px}
.modes button{background:#fff;color:var(--ink);border:3px solid #26304a33;font-size:18px;padding:10px 22px;border-radius:999px}
.modes button.on{background:#26304a;color:#fff;border-color:#26304a}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 2px}
.fr .nu{border-bottom:3px solid currentColor;padding:0 6px;text-align:center}
.fr .de{padding:0 6px;text-align:center}
.term{display:inline-flex;align-items:center;gap:2px}
.term sup{font-size:.6em;align-self:flex-start}
.bp{font-size:2.1em;font-weight:300;line-height:1}
.sup{font-size:.62em;align-self:flex-start;margin-left:-6px;line-height:1.6}.small{font-size:13px;opacity:.75;margin-top:8px}.lbl{font-size:13px;opacity:.65;margin:6px 0 2px}
.line{font-size:clamp(18px,4.2vw,30px);font-weight:700;line-height:2;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.grp{display:inline-flex;gap:8px;padding:0 10px;border-radius:12px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,white)}
.a .grp{animation:blink 3.5s ease-in-out infinite}
.b .grp{animation:pop 1.2s both;animation-delay:var(--d)}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{color:#fff;font-weight:700;padding:6px 12px;border-radius:12px;background:var(--c);font-size:clamp(14px,3.4vw,18px);animation:pop 1.1s both;animation-delay:var(--d)}
.arrow{font-size:16px;font-weight:700;opacity:.7;animation:fade .4s both;animation-delay:var(--d)}
.b .tok{animation:fade 1s both;animation-delay:var(--d)}
.res{text-align:center;font-size:clamp(28px,8vw,52px);font-weight:900;color:#fff;background:linear-gradient(90deg,var(--c2),var(--c1));padding:14px;border-radius:22px;margin:16px 0;animation:bounce .9s both}
@keyframes slide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-8deg)}70%{transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes bounce{0%{opacity:0;transform:translateY(-60px)}50%{transform:translateY(0)}65%{transform:translateY(-18px)}80%{transform:translateY(0)}90%{transform:translateY(-6px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>Hatványok – lépésről lépésre</h1>
<div class="modes" id="modes"></div>
<div class="rules" id="rules"></div>
<div class="input">
<input id="inp" value="2 · (3 + 1)^2 - (18 - 53) : (-7) + 3 · (-2)^3" aria-label="Kifejezés" autocomplete="off">
<div class="row">
<button class="pow" id="pow" type="button" title="Hatvány jel beszúrása">^ hatvány</button>
<button class="go" id="go">Megoldás</button>
<button class="next" id="next" disabled>Következő lépés ▶</button>
<button class="alt" id="all" disabled>Mind egyszerre</button>
</div>
<div class="row" id="exrow"></div>
<div class="small" id="hint"></div>
<div class="err" id="err"></div>
</div>
<div id="out"></div>
</div>
<script>
const OPS={'+':'+','-':'−','*':'·',':':':','^':'^'};
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const isPow=x=>x&&x.k==='op'&&x.v==='^';
function pw(b,e){if(!Number.isInteger(e)||e<0||e>12)throw 'A kitevő legyen 0 és 12 közötti egész szám.';if(b===0&&e===0)throw 'A 0⁰ nem értelmezett.';const r=Math.pow(b,e);if(!isFinite(r)||Math.abs(r)>1e12)throw 'Túl nagy szám.';return r;}
const fmt=v=>String(Math.round(v*1e6)/1e6).replace('.',',').replace('-','−');
const isMD=x=>x&&x.k==='op'&&(x.v==='*'||x.v===':');

function tokenize(src){
  const s=src.replace(/\s+/g,'').replace(/[\[{]/g,'(').replace(/[\]}]/g,')').replace(/[·×xX*]/g,'*').replace(/[÷\/:]/g,':').replace(/[−–]/g,'-').replace(/,/g,'.');
  if(!s)throw 'Írj be egy kifejezést!';
  const t=[];let i=0;const prev=()=>t[t.length-1];
  const glue=()=>{const p=prev();if(p&&(p.k==='num'||p.k===')'))t.push({k:'op',v:'*'});};
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){const m=s.slice(i).match(/^\d+(\.\d+)?/);if(!m)throw 'Hibás szám.';glue();t.push({k:'num',v:parseFloat(m[0])});i+=m[0].length;continue;}
    if(c==='('){glue();t.push({k:'('});i++;continue;}
    if(c===')'){t.push({k:')'});i++;continue;}
    if('+-*:^'.includes(c)){
      const p=prev();
      if(!p||p.k==='op'||p.k==='('){
        if(c==='+'){const m=s.slice(i+1).match(/^\d+(\.\d+)?/);if(m&&p&&p.k==='('&&s[i+1+m[0].length]===')'){t.push({k:'num',v:parseFloat(m[0]),plus:true});i+=1+m[0].length;continue;}i++;continue;}
        if(c==='-'){
          const m=s.slice(i+1).match(/^\d+(\.\d+)?/);
          if(m){const after=s[i+1+m[0].length];if(after==='^')t.push({k:'num',v:-1},{k:'op',v:'*'},{k:'num',v:parseFloat(m[0])});else t.push({k:'num',v:-parseFloat(m[0])});i+=1+m[0].length;continue;}
          if(s[i+1]==='('){t.push({k:'num',v:-1},{k:'op',v:'*'});i++;continue;}
        }
        throw 'Hibás kifejezés: két művelet követi egymást.';
      }
      t.push({k:'op',v:c});i++;continue;
    }
    throw 'Ismeretlen jel: '+c;
  }
  return t;
}
function validate(t){
  let exp=true,d=0;
  for(const x of t){
    if(exp){if(x.k==='num')exp=false;else if(x.k==='(')d++;else throw 'Hibás kifejezés.';}
    else{if(x.k==='op')exp=true;else if(x.k===')'){if(--d<0)throw 'Zárójel hiba.';}else throw 'Hibás kifejezés.';}
  }
  if(exp||d!==0)throw 'Hibás kifejezés (hiányzó szám, művelet vagy zárójel).';
}
function chainCheck(t){for(let i=0;i+2<t.length;i++)if(isPow(t[i])&&isPow(t[i+2]))throw 'Több hatvány egymás után nem támogatott, használj zárójelet.';}
function collapse(t){
  let ch=true;
  while(ch){ch=false;for(let i=0;i+2<t.length;i++)if(t[i].k==='('&&t[i+1].k==='num'&&t[i+2].k===')'){t.splice(i,3,t[i+1]);ch=true;break;}}
  return t;
}
function txt(items,wrap){
  const parts=[];
  items.forEach((x,i)=>{
    const p=items[i-1],n=items[i+1];
    if(isPow(x))return;
    if(x.k==='num'){
      const s=fmt(x.v);
      if(isPow(p)){parts[parts.length-1]+=s.split('').map(c=>SUP[c]||c).join('');return;}
      parts.push(x.plus?'(+'+s+')':((x.v<0&&(wrap||(p&&p.k==='op')||isPow(n)))?'('+s+')':s));
    }else parts.push(x.k==='op'?OPS[x.v]:x.k);
  });
  return parts.join(' ').replace(/\( /g,'(').replace(/ \)/g,')');
}
function evalFlat(a){
  const nums=[a[0].v],ops=[];
  for(let i=1;i<a.length;i+=2){ops.push(a[i].v);nums.push(a[i+1].v);}
  for(let k=ops.length-1;k>=0;k--)if(ops[k]==='^'){nums[k]=pw(nums[k],nums[k+1]);nums.splice(k+1,1);ops.splice(k,1);}
  const v=[nums[0]],o=[];
  for(let i=0;i<ops.length;i++){
    const op=ops[i],n=nums[i+1];
    if(op==='*')v[v.length-1]*=n;
    else if(op===':'){if(n===0)throw 'Nullával nem lehet osztani!';v[v.length-1]/=n;}
    else{o.push(op);v.push(n);}
  }
  let r=v[0];o.forEach((op,i)=>r=op==='+'?r+v[i+1]:r-v[i+1]);
  return r;
}
function nextStage(t){
  const before=[],after=[],out=[],notes=[];let g=0,phase,title,hint;
  const keep=x=>{before.push({...x,g:null});after.push({...x,g:null});out.push(x);};
  if(t.some(x=>x.k==='(')){
    phase=0;title='zárójelek';hint='A zárójelen belül számolok, utána újraírom a sort.';
    for(let i=0;i<t.length;){
      if(t[i].k==='('){
        let j=i+1;while(j<t.length&&t[j].k!=='('&&t[j].k!==')')j++;
        if(t[j]&&t[j].k===')'){
          const inner=t.slice(i+1,j),v=evalFlat(inner),n={k:'num',v};
          for(let q=i;q<=j;q++)before.push({...t[q],g});
          after.push({...n,g});out.push(n);
          notes.push({g,text:'('+txt(inner)+') = '+fmt(v)});g++;i=j+1;continue;
        }
      }
      keep(t[i]);i++;
    }
  }else if(t.some(isPow)){
    phase=3;title='hatványozás';hint='A hatványt a szorzás és osztás előtt számolom ki.';
    for(let i=0;i<t.length;){
      if(t[i].k==='num'&&isPow(t[i+1])){
        const run=t.slice(i,i+3),v=pw(t[i].v,t[i+2].v),n={k:'num',v};
        run.forEach(x=>before.push({...x,g}));after.push({...n,g});out.push(n);
        notes.push({g,text:txt(run)+' = '+fmt(v)});g++;i+=3;
      }else{keep(t[i]);i++;}
    }
  }else if(t.some(isMD)){
    phase=1;title='szorzás és osztás';hint='Balról jobbra haladok, az összeadás és kivonás előtt.';
    for(let i=0;i<t.length;){
      if(t[i].k==='num'&&isMD(t[i+1])){
        let j=i,v=t[i].v;
        while(isMD(t[j+1])){const n=t[j+2].v;if(t[j+1].v==='*')v*=n;else{if(n===0)throw 'Nullával nem lehet osztani!';v/=n;}j+=2;}
        const run=t.slice(i,j+1),n={k:'num',v};
        run.forEach(x=>before.push({...x,g}));after.push({...n,g});out.push(n);
        notes.push({g,text:txt(run,true)+' = '+fmt(v)});g++;i=j+1;
      }else{keep(t[i]);i++;}
    }
  }else{
    phase=2;title='összeadás és kivonás';hint='Balról jobbra haladok, így kapom a végeredményt.';
    let acc=t[0].v;
    for(let i=1;i<t.length;i+=2){
      const n=t[i+1].v,r=t[i].v==='+'?acc+n:acc-n;
      notes.push({g:0,text:txt([{k:'num',v:acc},t[i],t[i+1]])+' = '+fmt(r)});acc=r;
    }
    t.forEach(x=>before.push({...x,g:0}));
    const n={k:'num',v:acc};after.push({...n,g:0});out.push(n);
  }
  return{phase,title,hint,before,after,out,notes};
}
function lineEl(items,cls,delay){
  const d=document.createElement('div');d.className='line '+cls;
  let cur=null,cg=null;
  items.forEach((x,i)=>{
    if(isPow(x))return;
    const sp=document.createElement('span');sp.className='tok';
    if(x.k==='num'){
      const p=items[i-1],n=items[i+1],s=fmt(x.v);
      if(isPow(p)){sp.className='tok sup';sp.textContent=s;}
      else sp.textContent=x.plus?'(+'+s+')':((x.v<0&&((p&&p.k==='op')||isPow(n)))?'('+s+')':s);
    }
    else sp.textContent=x.k==='op'?OPS[x.v]:x.k;
    if(x.g!=null){
      if(!cur||cg!==x.g){cur=document.createElement('span');cur.className='grp';cur.style.setProperty('--c','var(--c'+(x.g%5)+')');if(delay!=null)cur.style.setProperty('--d',delay+'s');cg=x.g;d.appendChild(cur);}
      cur.appendChild(sp);
    }else{cur=null;cg=null;if(delay!=null)sp.style.setProperty('--d',delay+'s');d.appendChild(sp);}
  });
  return d;
}
function stageEl(s){
  const el=document.createElement('div');el.className='stage ph'+s.phase;
  el.innerHTML='<div class="shead"><span class="badge"></span><span class="hint"></span></div><div class="lbl">Ezt a sort számoljuk:</div>';
  el.querySelector('.badge').textContent=s.title;el.querySelector('.hint').textContent=s.hint;
  el.appendChild((s.frac?fracLine:lineEl)(s.before,'a',null));
  const nt=document.createElement('div');nt.className='notes';
  s.notes.forEach((n,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=n.text;c.style.setProperty('--c','var(--c'+(n.g%5)+')');c.style.setProperty('--d',(0.6+i*1.3)+'s');nt.appendChild(c);});
  el.appendChild(nt);
  const t0=0.6+s.notes.length*1.3;
  const ar=document.createElement('div');ar.className='arrow';ar.textContent='⬇ újraírom a sort';ar.style.setProperty('--d',t0+'s');el.appendChild(ar);
  el.appendChild((s.frac?fracLine:lineEl)(s.after,'b',t0+0.7));
  return el;
}

let MODE='simple';
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
const lcm=(a,b)=>a/gcd(a,b)*b;
const supN=e=>String(e).split('').map(c=>SUP[c]).join('');
const vt=(n,d)=>d===1?fmt(n):fmt(n)+'/'+d;
const baseTxt=p=>{const s=fmt(p.b);return p.b<0?'('+s+')':(p.plus?'(+'+s+')':s);};
const ptxt=p=>baseTxt(p)+(p.e!==null?supN(p.e):'');
const BIG=1e9;
function chk(n){if(Math.abs(n)>BIG)throw 'Túl nagy szám.';return n;}

function parseFrac(src){
  const s=src.replace(/\s+/g,'').replace(/[\[{]/g,'(').replace(/[\]}]/g,')').replace(/[−–]/g,'-').replace(/[÷:]/g,'/');
  if(!s)throw 'Írj be egy kifejezést!';
  let i=0;const peek=()=>s[i];
  const int=()=>{const m=s.slice(i).match(/^\d+/);if(!m)throw 'Hibás kifejezés a(z) '+(i+1)+'. jel körül.';i+=m[0].length;return parseInt(m[0],10);};
  const exp=()=>{if(peek()==='^'){i++;const e=int();if(e>12)throw 'A kitevő legyen 0 és 12 közötti egész szám.';return e;}return null;};
  function atom(){
    if(peek()==='('){
      i++;let sg=1,plus=false;
      if(peek()==='-'){sg=-1;i++;}else if(peek()==='+'){plus=true;i++;}
      const n=int();let d=null;
      if(peek()==='/'){i++;d=int();if(d===0)throw 'Nullával nem lehet osztani!';}
      if(peek()!==')')throw 'Hibás zárójel.';i++;
      const e=exp();
      if(d!==null)return e===null?{type:'fr',n:sg*n,d}:{type:'bf',n:sg*n,d,e};
      return{type:'int',b:sg*n,e,plus};
    }
    return{type:'int',b:int(),e:exp()};
  }
  const mkp=a=>({b:a.b,e:a.e,plus:a.plus});
  function term(sign){
    const a=atom();
    if(peek()==='/'){
      i++;const c=atom();
      if(a.type!=='int'||c.type!=='int')throw 'Ilyen alak nem támogatott: a törtvonal két oldalán egész szám (hatványa) állhat.';
      return{sign,k:'pp',a:mkp(a),c:mkp(c)};
    }
    if(a.type==='bf')return{sign,k:'bf',n:a.n,d:a.d,e:a.e};
    if(a.type==='fr')return{sign,k:'val',n:a.n,d:a.d};
    return{sign,k:'pp',a:mkp(a),c:null};
  }
  let sign='+';
  if(peek()==='-'){sign='-';i++;}else if(peek()==='+')i++;
  const T=[term(sign)];
  while(i<s.length){
    const ch=s[i];
    if(ch!=='+'&&ch!=='-')throw 'Hibás kifejezés a(z) '+(i+1)+'. jelnél: "'+ch+'".';
    i++;T.push(term(ch));
  }
  return T;
}
function normTrivial(T){
  return T.map(t=>{
    if(t.k==='pp'&&t.a.e===null&&(!t.c||t.c.e===null)){
      let n=t.a.b,d=t.c?t.c.b:1;
      if(d===0)throw 'Nullával nem lehet osztani!';
      if(d<0){n=-n;d=-d;}
      return{sign:t.sign,k:'val',n,d};
    }
    return t;
  });
}
function nextFracStage(T,ctx){
  const mk=(phase,title,hint)=>({frac:true,phase,title,hint,before:[],after:[],out:[],notes:[]});
  const same=(s,t)=>{s.before.push({...t,g:null});s.after.push({...t,g:null});s.out.push(t);};
  let g=0,s;
  if(T.some(t=>t.k==='bf')){
    s=mk(3,'törtek hatványozása','A zárójeles törtnél a számlálót és a nevezőt is hatványozni kell.');
    T.forEach(t=>{
      if(t.k==='bf'){
        const o={sign:t.sign,k:'pp',a:{b:t.n,e:t.e},c:{b:t.d,e:t.e}};
        s.before.push({...t,g});s.after.push({...o,g});s.out.push(o);
        s.notes.push({g,text:'('+vt(t.n,t.d)+')'+supN(t.e)+' = '+ptxt(o.a)+'/'+ptxt(o.c)});g++;
      }else same(s,t);
    });
    return s;
  }
  if(T.some(t=>t.k==='pp')){
    s=mk(3,'hatványok kiszámolása','Minden hatványt kiszámolok, így közönséges törtek lesznek.');
    T.forEach(t=>{
      if(t.k==='pp'){
        let n=chk(pw(t.a.b,t.a.e===null?1:t.a.e)),d=t.c?chk(pw(t.c.b,t.c.e===null?1:t.c.e)):1;
        if(d===0)throw 'Nullával nem lehet osztani!';
        if(d<0){n=-n;d=-d;}
        const o={sign:t.sign,k:'val',n,d};
        s.before.push({...t,g});s.after.push({...o,g});s.out.push(o);
        s.notes.push({g,text:ptxt(t.a)+(t.c?'/'+ptxt(t.c):'')+' = '+vt(n,d)});g++;
      }else same(s,t);
    });
    return s;
  }
  if(!ctx.cd&&T.some(t=>gcd(t.n,t.d)>1)){
    s=mk(0,'egyszerűsítés','Egyszerűsítek: a számlálót és a nevezőt is elosztom ugyanazzal a számmal.');
    T.forEach(t=>{
      const k=gcd(t.n,t.d);
      if(k>1){
        const o={...t,n:t.n/k,d:t.d/k};
        s.before.push({...t,g});s.after.push({...o,g});s.out.push(o);
        s.notes.push({g,text:vt(t.n,t.d)+' = '+vt(o.n,o.d)+'  (mindkettőt osztom '+k+'-vel)'});g++;
      }else same(s,t);
    });
    return s;
  }
  if(T.length>1){
    const L=T.reduce((a,t)=>lcm(a,t.d),1);
    if(T.some(t=>t.d!==L)){
      chk(L);
      s=mk(1,'közös nevezőre hozás','Közös nevező: '+L+'. A számlálót és a nevezőt is ugyanazzal a számmal szorzom.');
      T.forEach(t=>{
        if(t.d!==L){
          const f=L/t.d,o={...t,n:chk(t.n*f),d:L};
          s.before.push({...t,g});s.after.push({...o,g});s.out.push(o);
          s.notes.push({g,text:vt(t.n,t.d)+' = '+vt(o.n,o.d)+'  (mindkettőt szorzom '+f+'-val)'});g++;
        }else same(s,t);
      });
      ctx.cd=true;return s;
    }
    s=mk(2,'összeadás és kivonás','A nevező marad, csak a számlálókat adom össze, illetve vonom ki.');
    const w=n=>n<0?'('+fmt(n)+')':fmt(n);
    let total=0,chain='';
    T.forEach((t,i)=>{
      const neg=t.sign==='-';total+=neg?-t.n:t.n;
      chain+=i===0?(neg?'−'+w(t.n):fmt(t.n)):(neg?' − ':' + ')+w(t.n);
      s.before.push({...t,g:0});
    });
    const o={sign:'+',k:'val',n:total,d:L};
    s.after.push({...o,g:0});s.out.push(o);
    s.notes.push({g:0,text:'számlálók: '+chain+' = '+fmt(total)});
    s.notes.push({g:0,text:'a nevező marad: '+L});
    ctx.cd=false;return s;
  }
  return null;
}

function baseNode(p){const sp=el('span',null,baseTxt(p));if(p.e!==null)sp.appendChild(el('sup',null,String(p.e)));return sp;}
function stack(a,b){const f=el('span','fr'),n=el('span','nu'),d=el('span','de');n.appendChild(a);d.appendChild(b);f.append(n,d);return f;}
function valNode(n,d,paren){
  const w=el('span','term'),neg=n<0,a=Math.abs(n),big=d!==1&&neg&&paren;
  if(big)w.appendChild(el('span','bp','('));else if(neg&&paren)w.appendChild(el('span',null,'('));
  if(neg)w.appendChild(el('span',null,'−'));
  w.appendChild(d===1?el('span',null,String(a)):stack(el('span',null,String(a)),el('span',null,String(d))));
  if(big)w.appendChild(el('span','bp',')'));else if(neg&&paren)w.appendChild(el('span',null,')'));
  return w;
}
function termNode(t,paren){
  if(t.k==='val')return valNode(t.n,t.d,paren);
  const w=el('span','term');
  if(t.k==='bf'){
    w.appendChild(el('span','bp','('));
    if(t.n<0)w.appendChild(el('span',null,'−'));
    w.appendChild(stack(el('span',null,String(Math.abs(t.n))),el('span',null,String(t.d))));
    w.appendChild(el('span','bp',')'));w.appendChild(el('sup',null,String(t.e)));
    return w;
  }
  if(t.c)w.appendChild(stack(baseNode(t.a),baseNode(t.c)));else w.appendChild(baseNode(t.a));
  return w;
}
function assemble(E,cls,delay){
  const d=el('div','line '+cls);let cur=null,cg=null;
  E.forEach(({node,g})=>{
    if(g!=null){
      if(!cur||cg!==g){cur=el('span','grp');cur.style.setProperty('--c','var(--c'+(g%5)+')');if(delay!=null)cur.style.setProperty('--d',delay+'s');cg=g;d.appendChild(cur);}
      cur.appendChild(node);
    }else{cur=null;cg=null;if(delay!=null)node.style.setProperty('--d',delay+'s');d.appendChild(node);}
  });
  return d;
}
function fracLine(T,cls,delay){
  const all=T.every(t=>t.g!=null&&t.g===T[0].g),E=[];
  T.forEach((t,i)=>{
    const neg=t.sign==='-';
    if(i>0)E.push({node:el('span','tok',neg?'−':'+'),g:(T[i-1].g===t.g?t.g:null)});
    else if(neg)E.push({node:el('span','tok','−'),g:all?t.g:null});
    const tn=termNode(t,i>0||neg);tn.classList.add('tok');
    E.push({node:tn,g:t.g});
  });
  return assemble(E,cls,delay);
}

const MODES={
  simple:{rules:[['r3','1. Hatványozás aⁿ'],['r2','2. Összeadás + és kivonás −']],
    def:'(-2)^3 + (-2)^2 - (+3)^2',ex:['2^3 + (-3)^2 - 4^2','(-1)^5 + (-2)^4 - (+5)^2','(-3)^2 - (-2)^3 + 2^2'],
    hint:'Hatvány: ^ jellel, pl. 2^3 jelentése 2³. A negatív alapot zárójelbe kell tenni: (−2)^2 = 4, de −2^2 = −(2²) = −4.'},
  frac:{rules:[['r3','1. Hatványozás (számláló és nevező külön)'],['r0','2. Egyszerűsítés'],['r1','3. Közös nevező'],['r2','4. Összeadás + és kivonás −']],
    def:'(1/2)^2 + 1^3/2^2 - (-2/3)^2',ex:['(2/3)^2 - (1/2)^3','(-1/2)^3 + 3^2/2^3 - 1/4','(3/4)^2 + 2^3/3^2 - (-1/3)^2'],
    hint:'Törtvonal: / jellel. Tagok: (1/2)^2, 1^3/2^2, (−2/3)^2, egész szám vagy egész hatványa. A tagokat + vagy − köti össze.'},
  complex:{rules:[['r0','1. Zárójel ( )'],['r3','2. Hatványozás aⁿ'],['r1','3. Szorzás · és osztás :'],['r2','4. Összeadás + és kivonás −']],
    def:'2 · (3 + 1)^2 - (18 - 53) : (-7) + 3 · (-2)^3',ex:['(12 - 20) · 3 - 24 : (-6)','3 · 2^3 - (5 - 7)^2 : 4 + 10','(-2)^3 + 4 · 3^2 - 10 : (-5)','2 · (3 + (4 - 6)^2 · 5) - 7^2'],
    hint:'Hatvány: ^ jellel, pl. 2^3 jelentése 2³. Osztás: kettőspont. A −2^2 jelentése −(2²) = −4, a (−2)^2 viszont 4.'}
};
const LABELS={simple:'egyszerű',frac:'tört',complex:'összetett'};
function setMode(m){
  MODE=m;const M=MODES[m];
  const mb=document.getElementById('modes');mb.innerHTML='';
  Object.keys(LABELS).forEach(k=>{const b=el('button',k===m?'on':'',LABELS[k]);b.type='button';b.onclick=()=>setMode(k);mb.appendChild(b);});
  document.getElementById('rules').innerHTML=M.rules.map(r=>'<span class="rule '+r[0]+'">'+r[1]+'</span>').join('');
  document.getElementById('inp').value=M.def;
  const ex=document.getElementById('exrow');ex.innerHTML='';
  M.ex.forEach((e,i)=>{const b=el('button','ex','példa '+(i+1));b.type='button';b.onclick=()=>{document.getElementById('inp').value=e;start();};ex.appendChild(b);});
  document.getElementById('hint').textContent=M.hint;
  start();
}

let stages=[],shown=0,result=0;
const out=document.getElementById('out'),err=document.getElementById('err');
const nextB=document.getElementById('next'),allB=document.getElementById('all');
function start(){
  err.textContent='';out.innerHTML='';stages=[];shown=0;
  try{
    if(MODE==='frac'){
      let T=normTrivial(parseFrac(document.getElementById('inp').value));const ctx={cd:false};
      for(;;){const st=nextFracStage(T,ctx);if(!st)break;st.title=(stages.length+1)+'. lépés: '+st.title;stages.push(st);T=st.out;if(stages.length>40)throw 'Túl hosszú kifejezés.';}
      const r=T[0];result={n:(r.sign==='-'?-r.n:r.n),d:r.d};
    }else{
      const t0=tokenize(document.getElementById('inp').value);
      validate(t0);let t=collapse(t0);chainCheck(t);
      while(t.length>1){const st=nextStage(t);st.title=(stages.length+1)+'. lépés: '+st.title;stages.push(st);t=st.out;if(stages.length>50)throw 'Túl hosszú kifejezés.';}
      result=t[0].v;
    }
  }catch(e){err.textContent=String(e);nextB.disabled=allB.disabled=true;return;}
  if(!stages.length)finish();else{showNext();}
}
function finish(){
  const r=document.createElement('div');r.className='res';if(typeof result==='object')r.append('🎉 Megoldás: ',valNode(result.n,result.d,false));else r.textContent='🎉 Megoldás: '+fmt(result);out.appendChild(r);r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showNext(){
  if(shown>=stages.length)return;
  const el=stageEl(stages[shown++]);out.appendChild(el);
  if(shown>=stages.length){finish();nextB.disabled=allB.disabled=true;}
  else{nextB.disabled=allB.disabled=false;el.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
const inp=document.getElementById('inp'),powB=document.getElementById('pow');
powB.addEventListener('mousedown',e=>e.preventDefault());
powB.onclick=()=>{const a=inp.selectionStart??inp.value.length,z=inp.selectionEnd??a;inp.value=inp.value.slice(0,a)+'^'+inp.value.slice(z);inp.focus();inp.setSelectionRange(a+1,a+1);};
document.getElementById('go').onclick=start;
nextB.onclick=showNext;
allB.onclick=()=>{while(shown<stages.length)showNext();};
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')start();});
setMode('simple');
</script>
