<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helyiértékek csokival</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fcfaf5;--card:#fff;--tx:#17284a;--mut:#5b6785;--bd:#e4e0d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a24;--card:#202636;--tx:#eef1f8;--mut:#a6aec4;--bd:#323a50}}
:root[data-theme="dark"]{--bg:#161a24;--card:#202636;--tx:#eef1f8;--mut:#a6aec4;--bd:#323a50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;padding:14px}
h1{text-align:center;font-size:clamp(22px,5vw,38px);margin:6px 0 12px;letter-spacing:1px}
.top{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top input{font-size:28px;width:190px;text-align:center;padding:6px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-weight:700}
.top button{font-size:16px;padding:9px 14px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;max-width:1100px;margin:auto}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:8px;text-align:center}
.tag{color:#fff;font-weight:800;border-radius:10px;padding:6px 4px;font-size:14px}
.items{min-height:150px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding:10px 0}
.chip{border-radius:3px}
.rule{font-size:12px;color:var(--mut);min-height:48px}
.val{font-size:26px;font-weight:800;margin-top:4px}
.cnt{font-size:14px;color:var(--mut)}
.step{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px}
.step button{width:40px;height:40px;border-radius:50%;border:none;color:#fff;font-size:24px;font-weight:700;cursor:pointer}
.step b{font-size:26px;min-width:22px}
.eq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:18px auto;max-width:1100px;font-size:clamp(20px,4.5vw,40px);font-weight:800}
.eq span.b{padding:4px 14px;border-radius:14px}
.eq small{display:block;font-size:13px;font-weight:600;text-align:center;color:var(--mut)}
.eq div{text-align:center}
</style></head><body>
<h1>HELYIÉRTÉKEK CSOKIVAL</h1>
<div class="top">
<label>Írj be egy számot (0–999,999):</label>
<input id="num" inputmode="decimal" value="52,417" aria-label="szám">
<button id="rnd">🎲 Véletlen szám</button><button id="clr">Nulláz</button>
</div>
<div class="grid" id="grid"></div>
<div class="eq" id="eq"></div>
<script>
const P=[
{n:'SZÁZASOK',u:'százas',t:100,c:'#d9534f',r:'10 tízes (doboz) = 1 százas'},
{n:'TÍZESEK',u:'tízes',t:10,c:'#5a9a3a',r:'10 egyes (tábla) = 1 tízes (doboz)'},
{n:'EGYESEK',u:'egyes',t:1,c:'#2f7bc8',r:'1 egyes = 1 egész tábla csoki'},
{n:'TIZEDEK',u:'tized',t:.1,c:'#1d9a8a',r:'10 tized = 1 egyes (a tábla 1 kockája)'},
{n:'SZÁZADOK',u:'század',t:.01,c:'#e8892b',r:'10 század = 1 tized (a kocka tizedrésze)'},
{n:'EZREDEK',u:'ezred',t:.001,c:'#c2478a',r:'10 ezred = 1 század (a század tizedrésze)'}];
let d=[0,5,2,4,1,7];
const T=()=>d.reduce((s,x,i)=>s+x*Math.pow(10,5-i),0);
function fmt(t){const i=Math.floor(t/1000),f=String(t%1000).padStart(3,'0').replace(/0+$/,'');
 return String(i).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+(f?','+f:'');}
const BW=120,BH=22,LN='#3e2518';
function bar(x,y,w,h,n){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#5b3a29" stroke="${LN}"/>`;
 for(let k=1;k<n;k++)s+=`<line x1="${x+k*w/n}" x2="${x+k*w/n}" y1="${y+1}" y2="${y+h-1}" stroke="${LN}" stroke-width="1.3"/>`;
 return s+`<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${Math.max(1.5,h*.14)}" rx="1" fill="#8a5a40" opacity=".85"/>`;}
function egyes(){return `<svg width="${BW+4}" height="${BH+4}"><g transform="translate(2,2)">${bar(0,0,BW,BH,10)}</g></svg>`;}
function tizes(col){const g=3,h=10*BH+9*g;let s=`<svg width="${BW+12}" height="${h+8}"><g transform="translate(6,4)">`;
 for(let k=0;k<10;k++)s+=bar(0,k*(BH+g),BW,BH,10);
 return s+`<rect x="${BW*.46}" y="-3" width="9" height="${h+6}" rx="3" fill="${col}"/></g></svg>`;}
function szazas(col){const mw=54,mh=22,gx=6,gy=6,tw=2*mw+gx,th=5*mh+4*gy;let s=`<svg width="${tw+14}" height="${th+14}"><g transform="translate(7,7)">`;
 for(let r=0;r<5;r++)for(let c=0;c<2;c++){const x=c*(mw+gx),y=r*(mh+gy);
  s+=`<rect x="${x}" y="${y}" width="${mw}" height="${mh}" rx="3" fill="#5b3a29" stroke="${LN}"/>`;
  for(let k=1;k<10;k++)s+=`<line x1="${x+1}" x2="${x+mw-1}" y1="${y+k*mh/10}" y2="${y+k*mh/10}" stroke="${LN}"/>`;
  s+=`<rect x="${x+mw*.44}" y="${y-1}" width="5" height="${mh+2}" rx="2" fill="#5a9a3a"/>`;}
 return s+`<rect x="-5" y="-5" width="${tw+10}" height="${th+10}" rx="9" fill="none" stroke="${col}" stroke-width="4"/></g></svg>`;}
function piece(w,h){return `<svg width="${w+4}" height="${h+4}"><rect x="2" y="2" width="${w}" height="${h}" rx="${Math.min(2.5,h/2)}" fill="#5b3a29" stroke="${LN}"/><rect x="3.5" y="3.5" width="${Math.max(1,w-3)}" height="${Math.max(1,h*.16)}" fill="#8a5a40"/></svg>`;}
function item(i){const p=P[i];
 if(i==0)return szazas(p.c);
 if(i==1)return tizes(p.c);
 if(i==2)return egyes();
 return [piece(12,22),piece(12,3),piece(4,3)][i-3];}
function render(){
 const g=document.getElementById('grid');
 g.innerHTML=P.map((p,i)=>{
  const pv=d[i]*Math.pow(10,5-i);
  return `<div class="card"><div class="tag" style="background:${p.c}">${p.n}</div>
  <div class="items">${Array.from({length:d[i]},()=>item(i)).join('')||'<span style="color:var(--mut)">—</span>'}</div>
  <div class="rule">${p.r}</div>
  <div class="val" style="color:${p.c}">${fmt(pv)}</div><div class="cnt">(${d[i]} ${p.u})</div>
  <div class="step"><button style="background:${p.c}" data-i="${i}" data-d="-1" aria-label="kevesebb">−</button><b>${d[i]}</b><button style="background:${p.c}" data-i="${i}" data-d="1" aria-label="több">+</button></div></div>`}).join('');
 const parts=P.map((p,i)=>[p,d[i]*Math.pow(10,5-i)]).filter(x=>x[1]>0);
 const e=document.getElementById('eq');
 e.innerHTML=(parts.length?parts.map(([p,v],k)=>(k?'<span>+</span>':'')+`<div><span class="b" style="background:${p.c}22;color:${p.c}">${fmt(v)}</span><small>${p.n.toLowerCase()}</small></div>`).join(''):'')
  +`<span>=</span><div><span class="b" style="background:#ff8a3d33;color:#f47b20">${fmt(T())}</span><small>összesen</small></div>`;
 const inp=document.getElementById('num');
 if(document.activeElement!==inp)inp.value=fmt(T()).replace(/\u00a0/g,'');
}
document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 const i=+b.dataset.i;d[i]=Math.max(0,Math.min(9,d[i]+ +b.dataset.d));render();});
document.getElementById('num').addEventListener('input',e=>{
 const v=e.target.value.trim().replace(/\s/g,'').replace('.',',');
 if(!/^\d{1,3}(,\d{0,3})?$/.test(v))return;
 const [a,f='']=v.split(',');const s=a.padStart(3,'0')+f.padEnd(3,'0');
 d=s.split('').map(Number);render();});
document.getElementById('num').addEventListener('blur',render);
document.getElementById('rnd').onclick=()=>{d=d.map(()=>Math.floor(Math.random()*10));render();};
document.getElementById('clr').onclick=()=>{d=d.map(()=>0);render();};
render();
</script></body></html>
