<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Párosítsd a gépház részeit!</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --purple: #7c3aed;
    --bg1: #e0f2fe;
    --bg2: #fef9c3;
    --card-bg: #ffffff;
    --text: #1e293b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 2.2rem;
    color: var(--blue-dark);
    margin-bottom: 6px;
    text-shadow: 2px 2px 0 #fff;
  }

  .subtitle {
    text-align: center;
    font-size: 1.2rem;
    margin-bottom: 20px;
    color: #475569;
  }

  .top-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }

  .score-box, .timer-box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 12px 24px;
    font-size: 1.3rem;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    color: var(--blue-dark);
  }

  #newGameBtn {
    font-size: 1.2rem;
    font-weight: bold;
    padding: 12px 28px;
    border: none;
    border-radius: 16px;
    background: var(--purple);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #newGameBtn:hover {
    background: #6d28d9;
    transform: translateY(-2px);
  }

  .game-area {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
  }

  .column {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 320px;
    max-width: 480px;
    flex: 1;
  }

  .column-title {
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--blue-dark);
    margin-bottom: 4px;
  }

  .part-card {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    color: white;
    border-radius: 18px;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    cursor: grab;
    box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    border: 3px solid transparent;
    touch-action: none;
  }

  .part-card:active {
    cursor: grabbing;
  }

  .part-card.dragging {
    opacity: 0.5;
  }

  .part-card.matched {
    background: linear-gradient(135deg, #4ade80, #16a34a);
    box-shadow: 0 6px 14px rgba(22, 163, 74, 0.35);
    cursor: default;
    pointer-events: none;
  }

  .def-card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 20px;
    font-size: 20px;
    text-align: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    border: 3px dashed #94a3b8;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .def-card.dragover {
    border-color: var(--blue);
    transform: scale(1.03);
    background: #eff6ff;
  }

  .def-card.correct {
    background: var(--green-light);
    border: 3px solid var(--green);
    color: #14532d;
    font-weight: bold;
  }

  .def-card.wrong-flash {
    background: var(--red-light) !important;
    border-color: var(--red) !important;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
  }

  .matched-label {
    display: block;
    margin-top: 8px;
    font-size: 18px;
    font-weight: bold;
    color: #14532d;
  }

  .congrats {
    display: none;
    max-width: 600px;
    margin: 30px auto 0;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    border: 4px solid var(--green);
  }

  .congrats.show {
    display: block;
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .congrats h2 {
    color: var(--green);
    font-size: 2rem;
    margin-top: 0;
  }

  .congrats p {
    font-size: 1.3rem;
  }

  @media (max-width: 700px) {
    h1 { font-size: 1.6rem; }
    .subtitle { font-size: 1rem; }
    .part-card, .def-card { font-size: 18px; }
  }
</style>
</head>
<body>

<h1>🖥️ Párosítsd a gépház részeit!</h1>
<p class="subtitle">Húzd a bal oldali alkatrészt a hozzá illő jobb oldali meghatározásra!</p>

<div class="top-bar">
  <div class="score-box">Helyes párosítások: <span id="scoreCount">0</span> / 6</div>
  <div class="timer-box">⏱️ Idő: <span id="timer">00:00</span></div>
  <button id="newGameBtn">🔄 Új játék</button>
</div>

<div class="game-area">
  <div class="column">
    <div class="column-title">Alkatrészek</div>
    <div id="partsColumn"></div>
  </div>
  <div class="column">
    <div class="column-title">Meghatározások</div>
    <div id="defsColumn"></div>
  </div>
</div>

<div class="congrats" id="congrats">
  <h2>🎉 Gratulálunk! 🎉</h2>
  <p>Minden alkatrészt helyesen párosítottál!</p>
  <p>Eltelt idő: <strong id="finalTime">00:00</strong></p>
</div>

<script>
(function() {
  const PARTS = [
    { id: "alaplap", name: "Alaplap", def: "A számítógép alapja. Ide csatlakozik minden alkatrész." },
    { id: "cpu", name: "Processzor (CPU)", def: "A számítógép „agya”, elindítja a programokat és számolásokat végez." },
    { id: "ram", name: "Memória (RAM)", def: "Ideiglenesen tárolja a programokat és adatokat, amíg a számítógép be van kapcsolva." },
    { id: "ssd", name: "Merevlemez / SSD", def: "Hosszú távú tárolásra szolgál (pl. dokumentumok, képek, programok)." },
    { id: "psu", name: "Tápegység", def: "Árammal látja el a számítógép minden részét." },
    { id: "gpu", name: "Videokártya (GPU)", def: "A kép és a játékok megjelenítéséért felel." }
  ];

  let matchedCount = 0;
  let timerInterval = null;
  let seconds = 0;
  let draggedId = null;

  const partsColumn = document.getElementById("partsColumn");
  const defsColumn = document.getElementById("defsColumn");
  const scoreCountEl = document.getElementById("scoreCount");
  const timerEl = document.getElementById("timer");
  const congratsEl = document.getElementById("congrats");
  const finalTimeEl = document.getElementById("finalTime");
  const newGameBtn = document.getElementById("newGameBtn");

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return m + ":" + sec;
  }

  function startTimer() {
    stopTimer();
    seconds = 0;
    timerEl.textContent = formatTime(seconds);
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function buildBoard() {
    matchedCount = 0;
    scoreCountEl.textContent = "0";
    congratsEl.classList.remove("show");
    partsColumn.innerHTML = "";
    defsColumn.innerHTML = "";

    // Part cards stay in fixed original order on the left
    PARTS.forEach(part => {
      const card = document.createElement("div");
      card.className = "part-card";
      card.textContent = part.name;
      card.dataset.id = part.id;
      card.setAttribute("draggable", "true");

      card.addEventListener("dragstart", (e) => {
        draggedId = part.id;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", part.id);
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
      });

      // Touch support (basic tap-to-select then tap target)
      card.addEventListener("click", () => {
        if (card.classList.contains("matched")) return;
        document.querySelectorAll(".part-card").forEach(c => c.style.outline = "");
        draggedId = part.id;
        card.style.outline = "4px solid #fbbf24";
      });

      partsColumn.appendChild(card);
    });

    // Definitions shuffled on the right
    const shuffledDefs = shuffle(PARTS);
    shuffledDefs.forEach(part => {
      const card = document.createElement("div");
      card.className = "def-card";
      card.textContent = part.def;
      card.dataset.id = part.id;

      card.addEventListener("dragover", (e) => {
        if (card.classList.contains("correct")) return;
        e.preventDefault();
        card.classList.add("dragover");
      });
      card.addEventListener("dragleave", () => {
        card.classList.remove("dragover");
      });
      card.addEventListener("drop", (e) => {
        e.preventDefault();
        card.classList.remove("dragover");
        const droppedId = e.dataTransfer.getData("text/plain") || draggedId;
        handleAttempt(droppedId, card);
      });

      // Touch support: click definition after selecting a part
      card.addEventListener("click", () => {
        if (card.classList.contains("correct")) return;
        if (draggedId) {
          handleAttempt(draggedId, card);
        }
      });

      defsColumn.appendChild(card);
    });
  }

  function handleAttempt(partId, defCard) {
    if (!partId || defCard.classList.contains("correct")) return;
    const partCard = document.querySelector('.part-card[data-id="' + partId + '"]');
    if (!partCard || partCard.classList.contains("matched")) return;

    if (defCard.dataset.id === partId) {
      // correct match
      defCard.classList.add("correct");
      partCard.classList.add("matched");
      partCard.style.outline = "";
      const label = document.createElement("span");
      label.className = "matched-label";
      label.textContent = "✅ " + partCard.textContent;
      defCard.appendChild(label);
      matchedCount++;
      scoreCountEl.textContent = matchedCount.toString();
      draggedId = null;

      if (matchedCount === PARTS.length) {
        stopTimer();
        finalTimeEl.textContent = formatTime(seconds);
        congratsEl.classList.add("show");
      }
    } else {
      // wrong match
      defCard.classList.add("wrong-flash");
      setTimeout(() => {
        defCard.classList.remove("wrong-flash");
      }, 400);
    }
  }

  newGameBtn.addEventListener("click", () => {
    buildBoard();
    startTimer();
  });

  // init
  buildBoard();
  startTimer();
})();
</script>

</body>
</html>
