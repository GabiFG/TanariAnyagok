<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Számítógép eszközei - Pexeso</title>
<style>
  :root {
    --blue: #2f7fd6;
    --blue-dark: #1e5fa8;
    --orange: #f0862c;
    --orange-dark: #d76f18;
    --bg1: #eaf4ff;
    --bg2: #ffffff;
    --text: #2c3550;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  header { text-align: center; margin-bottom: 8px; }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .subtitle {
    color: #5b6b8c;
    font-size: 1.05rem;
    margin-bottom: 18px;
  }
  .stats {
    display: flex;
    gap: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .pill {
    background: var(--blue);
    color: white;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 1rem;
    box-shadow: 0 3px 8px rgba(47,127,214,0.35);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 640px;
  }
  .card {
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    cursor: pointer;
    position: relative;
    perspective: 800px;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    border-radius: 16px;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    box-shadow: 0 4px 10px rgba(30,50,90,0.18);
  }
  .card-back {
    color: white;
    font-size: 2rem;
    font-weight: 700;
  }
  .card-back::after {
    content: "?";
  }
  .card[data-type="image"] .card-back {
    background: linear-gradient(145deg, var(--blue), var(--blue-dark));
  }
  .card[data-type="text"] .card-back {
    background: linear-gradient(145deg, var(--orange), var(--orange-dark));
  }
  .card-front {
    transform: rotateY(180deg);
    flex-direction: column;
    padding: 8%;
    gap: 4px;
  }
  .card[data-type="image"] .card-front {
    background: linear-gradient(145deg, var(--blue), var(--blue-dark));
  }
  .card[data-type="text"] .card-front {
    background: linear-gradient(145deg, var(--orange), var(--orange-dark));
  }
  .card.matched .card-front {
    background: linear-gradient(145deg, #8fe3a3, #4fbf6e);
  }
  .card-front img {
    width: 72%;
    height: 72%;
    object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }
  .card-label {
    color: white;
    font-weight: 700;
    font-size: clamp(0.75rem, 3.2vw, 1.1rem);
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    line-height: 1.2;
  }
  .card:not(.flipped):not(.matched):hover .card-back {
    filter: brightness(1.08);
  }
  .win-banner {
    margin-top: 26px;
    background: linear-gradient(145deg, #4fbf6e, #2f9e4e);
    color: white;
    padding: 16px 28px;
    border-radius: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 6px 16px rgba(47,158,78,0.35);
    display: none;
  }
  .win-banner.show { display: block; animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .controls { margin-top: 22px; }
  button.reset {
    background: var(--orange);
    color: white;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(240,134,44,0.35);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button.reset:hover { background: var(--orange-dark); transform: translateY(-1px); }
  button.reset:active { transform: translateY(0); }

  @media (max-width: 480px) {
    .board { gap: 8px; }
    .card-front { padding: 6%; }
  }
</style>
</head>

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  const keys = Object.keys(ICONS);
  let deck = [];
  keys.forEach(k => {
    deck.push({ key: k, type: 'image' });
    deck.push({ key: k, type: 'text' });
  });
  return shuffle(deck);
}

function createCardEl(item, index) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.key = item.key;
  card.dataset.type = item.type;
  card.dataset.index = index;

  const inner = document.createElement('div');
  inner.className = 'card-inner';

  const back = document.createElement('div');
  back.className = 'card-face card-back';

  const front = document.createElement('div');
  front.className = 'card-face card-front';

  if (item.type === 'image') {
    const img = document.createElement('img');
    img.src = ICONS[item.key];
    img.alt = LABELS[item.key];
    front.appendChild(img);
  } else {
    const label = document.createElement('div');
    label.className = 'card-label';
    label.textContent = LABELS[item.key];
    front.appendChild(label);
  }

  inner.appendChild(back);
  inner.appendChild(front);
  card.appendChild(inner);

  card.addEventListener('click', () => onCardClick(card));
  return card;
}

function renderBoard() {
  board.innerHTML = '';
  const deck = buildDeck();
  deck.forEach((item, i) => {
    board.appendChild(createCardEl(item, i));
  });
}

function onCardClick(card) {
  if (lockBoard) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flippedCards.length === 2) return;

  if (flippedCards.length === 1 && card.dataset.type === flippedCards[0].dataset.type) {
    return;
  }

  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    tries++;
    triesEl.textContent = tries;
    checkMatch();
  }
}

function checkMatch() {
  const [c1, c2] = flippedCards;
  if (c1.dataset.key === c2.dataset.key) {
    lockBoard = true;
    setTimeout(() => {
      c1.classList.add('matched');
      c2.classList.add('matched');
      pairsFound++;
      pairsEl.textContent = pairsFound;
      flippedCards = [];
      lockBoard = false;
      if (pairsFound === Object.keys(ICONS).length) {
        setTimeout(showWin, 400);
      }
    }, 500);
  } else {
    lockBoard = true;
    setTimeout(() => {
      c1.classList.remove('flipped');
      c2.classList.remove('flipped');
      flippedCards = [];
      lockBoard = false;
    }, 900);
  }
}

function showWin() {
  finalTriesEl.textContent = tries;
  winBanner.classList.add('show');
}

function newGame() {
  tries = 0;
  pairsFound = 0;
  flippedCards = [];
  lockBoard = false;
  triesEl.textContent = 0;
  pairsEl.textContent = 0;
  winBanner.classList.remove('show');
  renderBoard();
}

resetBtn.addEventListener('click', newGame);

newGame();
</script>

</body>
</html>
