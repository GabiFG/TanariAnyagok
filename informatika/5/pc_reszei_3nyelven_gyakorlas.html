<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számítógép részei 3 nyelven</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            color: #2d3436;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #0984e3;
            margin-bottom: 5px;
            font-size: 2rem;
        }
        .subtitle {
            color: #636e72;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d63031;
            background: #ffeaa7;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: #2d3436;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button.option-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button.option-btn:hover {
            background-color: #74b9ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        button.option-btn:disabled {
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .result-box {
            font-size: 1.3rem;
            line-height: 1.6;
        }
        .trophy {
            font-size: 4rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Számítógép részei 3 nyelven</h1>
        <div class="subtitle">5. osztályos kvíz (Magyar - Szlovák - Angol)</div>
        <div class="score-board" id="score-board">Kérdés: 1 / 12 | Pontszám: 0</div>

        <div id="quiz-container">
            <div id="question-container">
                <div class="question-text" id="question-text">Kérdés helye</div>
            </div>

            <div class="options-grid" id="options-container">
                <!-- Opció gombok -->
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Mi szlovákul a billentyűzet?",
                options: ["klávesnica", "myš", "obrazovka", "počítačová skrinka"],
                correct: 0
            },
            {
                question: "Mi angolul a billentyűzet?",
                options: ["mouse", "keyboard", "monitor", "computer case"],
                correct: 1
            },
            {
                question: "Hogyan mondjuk szlovákul, hogy egér?",
                options: ["klávesnica", "obrazovka", "myš", "počítač"],
                correct: 2
            },
            {
                question: "Mit jelent szlovákul a „myš” kifejezés?",
                options: ["gépház", "képernyő", "billentyűzet", "egér"],
                correct: 3
            },
            {
                question: "Mi a szlovák neve a gépházanak?",
                options: ["počítačová skrinka", "obrazovka", "klávesnica", "myš"],
                correct: 0
            },
            {
                question: "Mi angolul a gépház?",
                options: ["monitor", "computer case / tower", "keyboard", "mouse"],
                correct: 1
            },
            {
                question: "Mi szlovákul a képernyő (monitor)?",
                options: ["myš", "klávesnica", "obrazovka", "skrinka"],
                correct: 2
            },
            {
                question: "Mi angolul a monitor?",
                options: ["mouse", "keyboard", "computer", "monitor / screen"],
                correct: 3
            },
            {
                question: "Hogyan mondják szlovákul azt, hogy számítógép (computer)?",
                options: ["počítač", "myš", "obrazovka", "klávesnica"],
                correct: 0
            },
            {
                question: "Mi angolul az egér?",
                options: ["screen", "mouse", "keyboard", "case"],
                correct: 1
            },
            {
                question: "Mit jelent angolul a szlovák „klávesnica” szó?",
                options: ["mouse", "monitor", "keyboard", "computer case"],
                correct: 2
            },
            {
                question: "Az alábbiak közül melyik párosítás HELYES a számítógép alkatrészeire?",
                options: [
                    "Egér = klávesnica", 
                    "Képernyő = myš", 
                    "Gépház = monitor", 
                    "Billentyűzet – klávesnica – keyboard"
                ],
                correct: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreBoard = document.getElementById("score-board");
        const quizContainer = document.getElementById("quiz-container");

        function loadQuestion() {
            answered = false;
            optionsContainer.innerHTML = "";

            const currentQ = quizData[currentQuestionIndex];
            questionText.innerText = currentQ.question;
            scoreBoard.innerText = `Kérdés: ${currentQuestionIndex + 1} / ${quizData.length} | Pontszám: ${score}`;

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const allButtons = optionsContainer.getElementsByTagName("button");

            if (selectedIndex === currentQ.correct) {
                selectedBtn.style.backgroundColor = "#00b894"; // Zöld (helyes)
                score++;
                
                // Automatikus továbblépés 1 másodperc múlva helyes válasz esetén
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }, 1000);

            } else {
                selectedBtn.style.backgroundColor = "#d63031"; // Piros (rossz)
                allButtons[currentQ.correct].style.backgroundColor = "#00b894"; // Mutatja a helyeset zölddel

                // Rossz válasznál is hagyunk 2 másodpercet, hogy lássa a helyes választ, aztán lép tovább
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }, 2000);
            }

            for (let btn of allButtons) {
                btn.disabled = true;
            }

            scoreBoard.innerText = `Kérdés: ${currentQuestionIndex + 1} / ${quizData.length} | Pontszám: ${score}`;
        }

        function showResults() {
            let trophy = "🏆";
            let message = "";
            const percentage = (score / quizData.length) * 100;

            if (percentage === 100) {
                trophy = "👑";
                message = "Hatalmas gratuláció! Te vagy a legokosabb informatikus! Hibátlan teljesítmény!";
            } else if (percentage >= 75) {
                trophy = "⭐";
                message = "Nagyon szép munka! Kiválóan ismered a szavakat magyarul, szlovákul és angolul is!";
            } else if (percentage >= 50) {
                trophy = "👍";
                message = "Jó lett! Egy kis gyakorlással még tökéletesebb lehet!";
            } else {
                message = "Érdemes még egyszer átfutni a szavakat, és próbáld újra!";
            }

            quizContainer.innerHTML = `
                <div class="trophy">${trophy}</div>
                <h2>Vége a Kvíz Kalandnak!</h2>
                <div class="result-box">
                    <p><b>Elért pontszám:</b> ${score} / ${quizData.length} (${Math.round(percentage)}%)</p>
                    <p>${message}</p>
                </div>
                <button class="option-btn" style="margin-top: 25px; background-color: #0984e3;" onclick="location.reload()">Játék újrakezdése 🔄</button>
            `;
        }

        loadQuestion();
    </script>

</body>
</html>
