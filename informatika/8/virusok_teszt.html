<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Vírusok és kártevők – tesztfeladatsor</title>
<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#1d2b4f;--mut:#5b6b8c;--pri:#3b6fe0;--ok:#1f9d55;--okbg:#e3f6ea;--bad:#d64545;--badbg:#fde8e8;--line:#d5def2;--opt:#f6f9ff;--opth:#eaf1ff;--shadow:rgba(40,70,140,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#10172b;--card:#1a2340;--ink:#e8edfb;--mut:#a4b0d0;--pri:#5b8cff;--ok:#4cc58a;--okbg:#17392b;--bad:#ff7a7a;--badbg:#42202a;--line:#2f3b63;--opt:#212c52;--opth:#2a3868;--shadow:rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));font-size:clamp(15px,1.1vw + 12px,19px);overflow-wrap:anywhere}
.wrap{width:100%;max-width:min(980px,100%)}
.card{background:var(--card);border-radius:clamp(14px,2vw,22px);padding:clamp(14px,3vw,30px);box-shadow:0 6px 24px var(--shadow)}
h1{margin:0 0 8px;font-size:clamp(23px,4vw + 8px,34px);line-height:1.2}
h2{font-size:clamp(18px,1.6vw + 12px,26px);line-height:1.35;margin:4px 0 14px}
h3{font-size:clamp(17px,1vw + 12px,21px)}
p{line-height:1.5;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:13px 26px;min-height:48px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media(hover:hover){.btn:hover{filter:brightness(1.1)}}
.top{display:flex;justify-content:space-between;gap:10px;font-size:.88em;color:var(--mut);margin-bottom:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.qgrid{display:grid;grid-template-columns:1fr;gap:6px 28px}
.qimg{display:flex;justify-content:center;align-items:center}
.pic{display:block;width:auto;max-width:100%;height:auto;max-height:min(230px,30vh);min-height:90px;margin:4px auto 8px;border-radius:12px;background:#fff;object-fit:contain}
.opts{display:grid;gap:10px}
.opt{text-align:left;width:100%;background:var(--opt);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;font:inherit;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center;touch-action:manipulation}
@media(hover:hover){.opt:hover:not(:disabled){border-color:var(--pri);background:var(--opth)}}
.opt b{background:var(--pri);color:#fff;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-size:.85em;flex:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.tf{grid-template-columns:1fr 1fr}.tf .opt{justify-content:center;text-align:center;font-size:1.15em;font-weight:700}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;line-height:1.45;display:none}
.fb.ok{display:block;background:var(--okbg);border-left:5px solid var(--ok)}.fb.bad{display:block;background:var(--badbg);border-left:5px solid var(--bad)}
.next{margin-top:14px;display:none;text-align:right}
.big{font-size:clamp(44px,9vw,68px);font-weight:800;color:var(--pri)}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.95em;color:var(--ink)}.rev small{color:var(--mut);display:block;margin-top:3px}
.center{text-align:center}
/* Széles vagy fekvő kijelző: kép bal oldalt, kérdés és válaszok jobbra */
@media(min-width:760px){.qgrid.has{grid-template-columns:minmax(220px,38%) 1fr;align-items:start}.qgrid.has .qimg{position:sticky;top:12px}.qgrid.has .pic{max-height:min(340px,60vh)}}
@media(orientation:landscape) and (max-height:520px){.qgrid.has{grid-template-columns:minmax(150px,34%) 1fr;align-items:start}.qgrid.has .pic{max-height:62vh}.card{padding:12px 16px}.opt{min-height:44px;padding:9px 12px}}
@media(max-width:480px){.tf{grid-template-columns:1fr}.next{text-align:center}.next .btn{width:100%}}
@media(max-width:340px){.card{padding:12px}.opt{gap:8px;padding:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{body{background:#fff}.card{box-shadow:none}}
</style></head><body><div class="wrap"><div class="card" id="app"></div></div>

function nextQ(){i++;i<DATA.length?show():end();window.scrollTo(0,0)}
function end(){
 const p=score/DATA.length;const m=p==1?'Tökéletes! Igazi digitális védelmi szakértő vagy! 🏆':p>=.8?'Nagyon ügyes vagy! 👏':p>=.5?'Jó alap, még gyakorolj egy kicsit! 💪':'Olvasd át újra az anyagot, és próbáld meg még egyszer! 📚';
 app.innerHTML=`<div class="center"><h1>Eredmény</h1><div class="big">${score} / ${DATA.length}</div><p>${m}</p></div>
 ${wrong.length?'<h3>Ezeket érdemes átnézni:</h3>'+wrong.map(w=>`<div class="rev">${w.q}<small>Jó válasz: ${w.a}</small></div>`).join(''):''}
 <div class="center" style="margin-top:16px"><button class="btn" onclick="start()">Újra</button></div>`}
start();
document.addEventListener('keydown',e=>{const o=[...document.querySelectorAll('.opt')];if(!o.length||o[0].disabled||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();let n='1234'.indexOf(k);if(n<0)n='abcd'.indexOf(k);if(n>=0&&o[n])o[n].click()});
</script></body></html>
